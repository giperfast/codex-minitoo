    <rect x="670" y="97" width="151" height="27" rx="4" fill="#142333"/>
    <text x="680" y="116" fill="#42c1ff" font-size="17">&gt; WORKING</text>
    <text x="675" y="145" fill="#b8cadb" font-size="11">5H</text><text x="811" y="145" text-anchor="end" fill="#fff" font-size="18">82%</text>
    <rect x="675" y="151" width="136" height="5" rx="2" fill="#243446"/><rect x="675" y="151" width="112" height="5" rx="2" fill="#42c1ff"/>
    <text x="675" y="166" fill="#b8cadb" font-size="8">RESET 21:38</text>
    <text x="675" y="184" fill="#b8cadb" font-size="11">WEEK</text><text x="811" y="184" text-anchor="end" fill="#fff" font-size="18">97%</text>
    <rect x="675" y="191" width="136" height="5" rx="2" fill="#243446"/><rect x="675" y="191" width="132" height="5" rx="2" fill="#ac87ff"/>
    <text x="675" y="208" fill="#b8cadb" font-size="8">RESET 03.10 17:35</text>
